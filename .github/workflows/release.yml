name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build frontend
        run: npx tsc && npx vite build

      - name: Build Tauri app
        run: npx tauri build

      - name: Upload Windows installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nssis/Yusra_*-setup.exe
            src-tauri/target/release/bundle/msi/Yusra_*.msi
          draft: false
          prerelease: false

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build frontend
        run: npx tsc && npx vite build

      - name: Build Tauri app (universal)
        run: npx tauri build --target universal-apple-darwin

      - name: Upload macOS DMG
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/Yusra_*.dmg
          draft: false
          prerelease: false
