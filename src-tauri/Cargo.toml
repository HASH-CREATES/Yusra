[package]
name = "yusra"
version = "0.1.0"
edition = "2021"

[lib]
name = "yusra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.32"
candle-core = "0.8"
candle-transformers = "0.8"
